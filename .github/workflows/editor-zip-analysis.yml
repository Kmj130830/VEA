name: Inspect and decompile uploaded Editor package

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/inspect_editor_zip.py"
      - "tools/ghidra/ExportVsmAnalysis.java"
      - "tools/ghidra/ExportS5ApiAnalysis.java"
      - "tools/ghidra/ExportVdmAnalysis.java"
      - ".github/workflows/editor-zip-analysis.yml"

permissions:
  contents: read

jobs:
  inventory-and-decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Inventory Editor.zip and extract every PE module
        run: python3 tools/inspect_editor_zip.py

      - name: Record PE import/export tables for every module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/editor-analysis/pe
          for file in build/editor-package/modules/*; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            objdump -p "$file" > "build/editor-analysis/pe/$name.txt" 2>&1 || true
          done

      - name: Install ILSpy and decompile managed candidate
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          mkdir -p build/editor-analysis/ilspy
          file="build/editor-package/modules/UriTemplate.Core.dll"
          if [[ -f "$file" ]]; then
            ilspycmd -l c "$file" > build/editor-analysis/ilspy/UriTemplate.Core.types.txt 2>&1 || true
            ilspycmd --project -o build/editor-analysis/ilspy/UriTemplate.Core "$file" > build/editor-analysis/ilspy/UriTemplate.Core.log 2>&1 || true
            ilspycmd --ilcode "$file" > build/editor-analysis/ilspy/UriTemplate.Core.il 2>&1 || true
          fi

      - name: Download and verify official Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"

      - name: Decompile VSM render and audio-buffer entry points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/editor-analysis/ghidra build/editor-ghidra-projects
          test -s build/editor-package/modules/VSM.dll
          "$GHIDRA_HEADLESS" "$PWD/build/editor-ghidra-projects" VEA_VSM             -import "$PWD/build/editor-package/modules/VSM.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportVsmAnalysis.java "$PWD/build/editor-analysis/ghidra/VSM_RENDER_BOUNDARY.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/editor-analysis/ghidra/VSM_RENDER_BOUNDARY.md

      - name: Decompile S5API opaque exports and bounded callers
        shell: bash
        run: |
          set -euo pipefail
          test -s build/editor-package/modules/S5API.dll
          "$GHIDRA_HEADLESS" "$PWD/build/editor-ghidra-projects" VEA_S5API \
            -import "$PWD/build/editor-package/modules/S5API.dll" \
            -scriptPath "$PWD/tools/ghidra" \
            -postScript ExportS5ApiAnalysis.java "$PWD/build/editor-analysis/ghidra/S5API_EXPORT_ANALYSIS.md" \
            -analysisTimeoutPerFile 600 -deleteProject
          test -s build/editor-analysis/ghidra/S5API_EXPORT_ANALYSIS.md

      - name: Decompile VDM voicebank and model metadata exports
        shell: bash
        run: |
          set -euo pipefail
          test -s build/editor-package/modules/VDM.dll
          "$GHIDRA_HEADLESS" "$PWD/build/editor-ghidra-projects" VEA_VDM \
            -import "$PWD/build/editor-package/modules/VDM.dll" \
            -scriptPath "$PWD/tools/ghidra" \
            -postScript ExportVdmAnalysis.java "$PWD/build/editor-analysis/ghidra/VDM_VOICEBANK_ANALYSIS.md" \
            -analysisTimeoutPerFile 600 -deleteProject
          test -s build/editor-analysis/ghidra/VDM_VOICEBANK_ANALYSIS.md

      - name: Preserve extracted PE inputs beside analysis reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/editor-analysis/extracted-modules
          cp -a build/editor-package/modules/. build/editor-analysis/extracted-modules/
          {
            echo "# Native module export/import summary"
            echo
            for file in build/editor-analysis/pe/*; do
              [[ -f "$file" ]] || continue
              name="$(basename "$file")"
              echo "## $name"
              echo
              awk '/The Export Tables/{flag=1} /The Import Tables|The Function Table/{flag=0} flag' "$file"
              echo
            done
          } > build/editor-analysis/PE_EXPORTS.md

      - name: Record Android ARM64 porting boundary
        run: |
          cat > build/editor-analysis/PORTING_STATUS.md <<'EOF'
          # Android ARM64 port status
          The new Editor.zip contains native Windows AMD64 PE modules, including VSM.dll.
          Static decompilation is used to recover public contracts and call paths. No Windows module is copied or renamed to .so.
          A real Android implementation must be built as ELF/ARM64 with Android NDK, replacing Windows APIs and validating the model-loading and audio callback contracts.
          The current VEA libveag2p.so remains a text-normalization prototype and does not synthesize singing.
          EOF
          cp build/editor-package/INVENTORY.md build/editor-analysis/
          cp build/editor-package/inventory.json build/editor-analysis/

      - name: Upload full static analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEA-Editor-zip-decompilation
          path: build/editor-analysis/
          if-no-files-found: error
          retention-days: 30

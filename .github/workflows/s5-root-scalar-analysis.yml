name: S5API render-root scalar trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/inspect_editor_zip.py"
      - "tools/ghidra/ExportS5RootScalarTrace.java"
      - ".github/workflows/s5-root-scalar-analysis.yml"

permissions:
  contents: read

jobs:
  root-scalar-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract Editor.zip PE modules
        run: python3 tools/inspect_editor_zip.py

      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"

      - name: Decompile render-root population and output transform setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/root-scalar-analysis/ghidra build/ghidra-root-scalar-project
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-root-scalar-project" VEA_S5_ROOT_SCALAR \
            -import "$PWD/build/editor-package/modules/S5API.dll" \
            -scriptPath "$PWD/tools/ghidra" \
            -postScript ExportS5RootScalarTrace.java "$PWD/build/root-scalar-analysis/ghidra/S5API_ROOT_SCALAR_TRACE.md" \
            -analysisTimeoutPerFile 600 -deleteProject
          test -s build/root-scalar-analysis/ghidra/S5API_ROOT_SCALAR_TRACE.md

      - name: Preserve report and input module metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/root-scalar-analysis/modules
          cp build/editor-package/modules/S5API.dll build/root-scalar-analysis/modules/
          objdump -p build/editor-package/modules/S5API.dll > build/root-scalar-analysis/modules/S5API_PE.txt

      - name: Upload focused root-scalar report
        uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-root-scalar-trace
          path: build/root-scalar-analysis/
          if-no-files-found: error
          retention-days: 30

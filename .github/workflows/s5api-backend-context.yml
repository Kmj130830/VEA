name: VEA S5API backend context trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5BackendContext.java"
      - ".github/workflows/s5api-backend-context.yml"

permissions:
  contents: read

jobs:
  backend-context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Trace runtime factory and virtual operation table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/backend-context/ghidra build/ghidra-backend-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-backend-projects" VEA_S5API_BACKEND             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5BackendContext.java "$PWD/build/backend-context/ghidra/S5API_BACKEND_CONTEXT.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/backend-context/ghidra/S5API_BACKEND_CONTEXT.md
      - name: Add report scope notes
        run: |
          cat > build/backend-context/PORTING_NOTES.md <<'EOF'
          # Backend context
          FUN_18013aa00 is a dispatch wrapper. The report traces the thread-local object factory and the indirect function pointer used by the generic tensor API.
          Only identified, reproducible operation kernels should be ported; the dispatch interface alone is not a computation contract.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-backend-context
          path: build/backend-context/
          if-no-files-found: error
          retention-days: 30

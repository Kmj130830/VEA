name: VEA S5API normalization and residual trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5NormalizationTrace.java"
      - ".github/workflows/s5api-normalization-trace.yml"

permissions:
  contents: read

jobs:
  normalization-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Decompile normalization and residual operator path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/normalization-trace/ghidra build/ghidra-norm-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-norm-projects" VEA_S5API_NORM             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5NormalizationTrace.java "$PWD/build/normalization-trace/ghidra/S5API_NORMALIZATION_TRACE.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/normalization-trace/ghidra/S5API_NORMALIZATION_TRACE.md
      - name: Package report notes
        run: |
          cat > build/normalization-trace/PORTING_NOTES.md <<'EOF'
          # Normalization trace
          The report captures the caller, scalar transform function, statistics dispatcher, and SIMD alternative.
          The ARM64 port must preserve the observed order of sum, sum-square, mean, variance clamp, epsilon, sqrt, and affine/residual transforms.
          Do not collapse the stages into a guessed conventional LayerNorm equation until the scalar helper and tensor strides have been confirmed.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-normalization-trace
          path: build/normalization-trace/
          if-no-files-found: error
          retention-days: 30

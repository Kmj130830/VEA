name: VEA AI Megpoid model-block shape and call-site trace

on:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5MegpoidBlockShapeMap.java"
      - ".github/workflows/s5api-megpoid-block-shape-map.yml"
  pull_request:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5MegpoidBlockShapeMap.java"
      - ".github/workflows/s5api-megpoid-block-shape-map.yml"

permissions:
  contents: read

jobs:
  model-block-shape-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract supplied S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Trace model-block constructors, callers and operator dimensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/megpoid-block-shape/ghidra build/ghidra-megpoid-block-shape
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-megpoid-block-shape" VEA_S5API_MEGPOID_BLOCK_SHAPE \
            -import "$PWD/build/editor-package/modules/S5API.dll" \
            -scriptPath "$PWD/tools/ghidra" \
            -postScript ExportS5MegpoidBlockShapeMap.java "$PWD/build/megpoid-block-shape/ghidra/S5API_MEGPOID_BLOCK_SHAPE.md" \
            -analysisTimeoutPerFile 600 -deleteProject
          test -s build/megpoid-block-shape/ghidra/S5API_MEGPOID_BLOCK_SHAPE.md
      - name: Add mapping scope notes
        run: |
          cat > build/megpoid-block-shape/PORTING_NOTES.md <<'EOF'
          # Megpoid model-block shape mapping
          The report is a static call-site and prototype trace. It must be reconciled
          with the actual AI_Megpoid.vtb2 object-tree index before assigning tensor
          roles or dimensions. Xrefs and pseudocode are not runtime execution proof.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: VEA-Megpoid-block-shape-map
          path: build/megpoid-block-shape/
          if-no-files-found: error
          retention-days: 30

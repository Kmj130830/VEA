name: VEA S5API recurrent layer and tensor ops trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5RnnTensorOps.java"
      - ".github/workflows/s5api-rnn-tensor-ops.yml"

permissions:
  contents: read
jobs:
  recurrent-tensor-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Trace RNN parameter construction and generic tensor operation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rnn-tensor-trace/ghidra build/ghidra-rnn-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-rnn-projects" VEA_S5API_RNN             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5RnnTensorOps.java "$PWD/build/rnn-tensor-trace/ghidra/S5API_RNN_TENSOR_OPS.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/rnn-tensor-trace/ghidra/S5API_RNN_TENSOR_OPS.md
      - name: Package report notes
        run: |
          cat > build/rnn-tensor-trace/PORTING_NOTES.md <<'EOF'
          # Recurrent and generic tensor operations
          This report explores RNN parameter construction/loading and the generic tensor operation invoked by the convolution block wrapper.
          Parameter key construction and matrix packing do not prove the forward GRU equations or sequence layout.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-rnn-tensor-ops
          path: build/rnn-tensor-trace/
          if-no-files-found: error
          retention-days: 30

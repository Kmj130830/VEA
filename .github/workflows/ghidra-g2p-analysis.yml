name: G2P static decompilation

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor dll.zip"
      - "tools/extract_g2p_targets.py"
      - "tools/ghidra/**"
      - ".github/workflows/ghidra-g2p-analysis.yml"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract selected G2P DLLs and record hashes
        run: python3 tools/extract_g2p_targets.py

      - name: Download and verify official Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            --output "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra-dist
          unzip -q "$archive" -d /tmp/ghidra-dist
          analyze_headless="$(find /tmp/ghidra-dist -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [[ -z "$analyze_headless" ]]; then
            echo "Could not find support/analyzeHeadless after extracting Ghidra."
            find /tmp/ghidra-dist -maxdepth 4 -type d -print | sort
            exit 1
          fi
          ghidra_dir="$(dirname "$(dirname "$analyze_headless")")"
          test -x "$analyze_headless"
          echo "GHIDRA_DIR=$ghidra_dir" >> "$GITHUB_ENV"

      - name: Run headless decompilation on G2P entry points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/g2p-analysis build/ghidra-projects
          while IFS= read -r dll; do
            name="$(basename "${dll%.dll}")"
            echo "=== Ghidra: $name ==="
            extra_seeds=()
            case "$name" in
              G2PAManager_KOR)
                extra_seeds=(0x180001ad0 0x1800024a0)
                ;;
              G2PAManager_CHS)
                extra_seeds=(0x180001af0 0x1800024c0)
                ;;
              G2PAManager_JPN)
                extra_seeds=(0x180001ac0 0x180001d50 0x180001eb0)
                ;;
            esac
            "$GHIDRA_DIR/support/analyzeHeadless" \
              "$PWD/build/ghidra-projects" "VEA_$name" \
              -import "$PWD/$dll" \
              -scriptPath "$PWD/tools/ghidra" \
              -postScript ExportG2pAnalysis.java "$PWD/build/g2p-analysis/$name.md" "${extra_seeds[@]}" \
              -deleteProject
            test -s "build/g2p-analysis/$name.md"
          done < <(find build/g2p-targets -maxdepth 1 -type f -name '*.dll' -print | sort)

          cp build/g2p-targets/SHA256SUMS.txt build/g2p-analysis/
          printf '\nAnalysis tool: Ghidra 12.2 (official release)\nTarget architecture: Windows AMD64 PE\nMode: static analysis only; no target execution\n' \
            > build/g2p-analysis/ANALYSIS_SCOPE.txt

      - name: Upload G2P decompilation reports
        uses: actions/upload-artifact@v4
        with:
          name: VEA-G2P-decompilation-reports
          path: build/g2p-analysis/
          if-no-files-found: error
          retention-days: 30

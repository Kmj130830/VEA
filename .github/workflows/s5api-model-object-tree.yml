name: VEA S5API model-object and tensor lookup trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5ModelObjectTree.java"
      - ".github/workflows/s5api-model-object-tree.yml"
  pull_request:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5ModelObjectTree.java"
      - ".github/workflows/s5api-model-object-tree.yml"

permissions:
  contents: read

jobs:
  model-object-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Trace model-object access and typed tensor readers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/model-object-tree/ghidra build/ghidra-model-object-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-model-object-projects" VEA_S5API_MODEL_OBJECT             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5ModelObjectTree.java "$PWD/build/model-object-tree/ghidra/S5API_MODEL_OBJECT_TREE.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/model-object-tree/ghidra/S5API_MODEL_OBJECT_TREE.md
      - name: Package interpretation guardrails
        run: |
          cat > build/model-object-tree/PORTING_NOTES.md <<'EOF'
          # Model-object parsing investigation
          This artifact records typed-object lookup, key derivation, tensor decoding, and caller argument setup.
          It is not a complete model-file parser and does not infer unknown container semantics.
          No vendor DLL is executed.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-model-object-tree
          path: build/model-object-tree/
          if-no-files-found: error
          retention-days: 30

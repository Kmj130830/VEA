name: VOCALOID7 native engine static analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor dll.zip"
      - "tools/extract_v7_engine_targets.py"
      - "tools/ghidra/ExportV7EngineAnalysis.java"
      - ".github/workflows/ghidra-v7-engine-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract selected V7 engine DLLs and record hashes
        run: python3 tools/extract_v7_engine_targets.py

      - name: Download and verify official Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            --output "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra-dist
          unzip -q "$archive" -d /tmp/ghidra-dist
          analyze_headless="$(find /tmp/ghidra-dist -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$analyze_headless"
          ghidra_dir="$(dirname "$(dirname "$analyze_headless")")"
          test -x "$analyze_headless"
          echo "GHIDRA_DIR=$ghidra_dir" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install ILSpy command-line decompiler
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Inspect CLR headers and decompile managed metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v7-engine-analysis
          python3 tools/inspect_v7_clr_metadata.py \
            build/v7-engine-targets/VOCALOID7.dll \
            build/v7-engine-targets/WaveOfflineRenderer.dll

          mkdir -p build/v7-engine-analysis/ilspy/VOCALOID7 build/v7-engine-analysis/ilspy/WaveOfflineRenderer
          for name in VOCALOID7 WaveOfflineRenderer; do
            dll="build/v7-engine-targets/$name.dll"
            output="build/v7-engine-analysis/ilspy/$name"
            echo "=== ILSpy $name ==="
            if ilspycmd -l c "$dll" > "$output/types.txt" 2> "$output/list-errors.txt"; then
              echo "type listing succeeded" > "$output/status.txt"
            else
              echo "type listing unavailable; see list-errors.txt" > "$output/status.txt"
            fi
            if ilspycmd --project -o "$output/project" "$dll" > "$output/decompile.log" 2>&1; then
              echo "project decompilation succeeded" >> "$output/status.txt"
            else
              echo "project decompilation unavailable; see decompile.log" >> "$output/status.txt"
            fi
            if ilspycmd --ilcode "$dll" > "$output/assembly.il" 2> "$output/il-errors.txt"; then
              echo "IL dump succeeded" >> "$output/status.txt"
            else
              echo "IL dump unavailable; see il-errors.txt" >> "$output/status.txt"
            fi
          done
      - name: Analyze V7 engine modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v7-engine-analysis build/ghidra-v7-projects
          while IFS= read -r dll; do
            name="$(basename "${dll%.dll}")"
            echo "=== Ghidra V7 target: $name ==="
            "$GHIDRA_DIR/support/analyzeHeadless" \
              "$PWD/build/ghidra-v7-projects" "VEA_$name" \
              -import "$PWD/$dll" \
              -scriptPath "$PWD/tools/ghidra" \
              -postScript ExportV7EngineAnalysis.java "$PWD/build/v7-engine-analysis/$name.md" \
              -deleteProject
            test -s "build/v7-engine-analysis/$name.md"
          done < <(find build/v7-engine-targets -maxdepth 1 -type f -name '*.dll' -print | sort)

          cp build/v7-engine-targets/SHA256SUMS.txt build/v7-engine-analysis/
          printf '\nAnalysis tool: Ghidra 12.2 (official release)\nTarget architecture: Windows AMD64 PE\nMode: static analysis only; no target execution\n' \
            > build/v7-engine-analysis/ANALYSIS_SCOPE.txt

      - name: Upload V7 engine decompilation reports
        uses: actions/upload-artifact@v4
        with:
          name: VEA-V7-engine-analysis
          path: build/v7-engine-analysis/
          if-no-files-found: error
          retention-days: 30

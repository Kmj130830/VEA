name: VEA S5API tensor parser and model payload analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "AI Model.zip"
      - "megpoidV7.zip"
      - "tools/inspect_editor_zip.py"
      - "tools/inspect_v7_model_payloads.py"
      - "tools/ghidra/ExportS5TensorParser.java"
      - ".github/workflows/s5api-tensor-analysis.yml"

permissions:
  contents: read

jobs:
  tensor-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Inspect proprietary model payloads without extraction
        run: python3 tools/inspect_v7_model_payloads.py

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract Editor.zip PE modules
        run: python3 tools/inspect_editor_zip.py

      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"

      - name: Decompile tensor readers, model-layer setup, GRU parameters, and DSP operator paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tensor-analysis/ghidra build/ghidra-tensor-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-tensor-projects" VEA_S5API_TENSOR             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5TensorParser.java "$PWD/build/tensor-analysis/ghidra/S5API_TENSOR_PARSER.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/tensor-analysis/ghidra/S5API_TENSOR_PARSER.md

      - name: Package static reports
        run: |
          set -euo pipefail
          mkdir -p build/tensor-analysis/model
          cp build/model-payload-analysis/* build/tensor-analysis/model/
          cat > build/tensor-analysis/PORTING_NOTES.md <<'EOF'
          # Tensor/parser analysis scope
          This artifact contains static byte-layout observations for supplied model files plus decompiled S5API parser helper functions.
          It does not implement a complete VTB2/VPIT/VHNV/VTMG reader or an Android neural inference pipeline.
          Any tensor dtype, layout, gate order, or normalization inferred from decompilation must be checked against actual package data and reference behavior.
          EOF

      - name: Upload tensor and model-format analysis
        uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-tensor-model-analysis
          path: build/tensor-analysis/
          if-no-files-found: error
          retention-days: 30

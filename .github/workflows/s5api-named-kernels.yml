name: VEA S5API named GEMM kernels

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5NamedKernels.java"
      - ".github/workflows/s5api-named-kernels.yml"

permissions:
  contents: read
jobs:
  named-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Map named kernel table and decompile baseline/NEON kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/named-kernels/ghidra build/ghidra-named-kernels
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-named-kernels" VEA_S5API_NAMED_KERNELS             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5NamedKernels.java "$PWD/build/named-kernels/ghidra/S5API_NAMED_KERNELS.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/named-kernels/ghidra/S5API_NAMED_KERNELS.md
      - name: Upload named kernel trace
        uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-named-kernels
          path: build/named-kernels/
          if-no-files-found: error
          retention-days: 30

name: VEA S5API core operator trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5CoreOpTrace.java"
      - ".github/workflows/s5api-core-operator-trace.yml"

permissions:
  contents: read

jobs:
  trace-core-operators:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract S5API.dll from the supplied editor archive
        run: python3 tools/inspect_editor_zip.py

      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"

      - name: Trace DWCONV kernel parameters and LNSTATS scalar fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/core-operator-trace/ghidra build/ghidra-core-operator-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-core-operator-projects" VEA_S5API_CORE_OPS             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5CoreOpTrace.java "$PWD/build/core-operator-trace/ghidra/S5API_CORE_OPERATOR_TRACE.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/core-operator-trace/ghidra/S5API_CORE_OPERATOR_TRACE.md

      - name: Package core operator report
        run: |
          mkdir -p build/core-operator-trace
          cat > build/core-operator-trace/PORTING_NOTES.md <<'EOF'
          # Core operator porting status
          This artifact focuses on the seven-row depthwise convolution path and layer-statistics fallback.
          The listing records parameter setup at indirect call sites so a portable ARM64 implementation can use verified strides, borders, and ownership.
          Do not treat a scalar fallback as a public ABI or call it with guessed buffers.
          EOF

      - name: Upload core operator analysis
        uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-core-operator-trace
          path: build/core-operator-trace/
          if-no-files-found: error
          retention-days: 30

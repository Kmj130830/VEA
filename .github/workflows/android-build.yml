name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect supplied engine and singer archives (static only)
        run: python3 tools/inspect_voice_archives.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android 16 SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Run native G2P, VSM callback, and S5 tensor tests
        run: |
          cmake -S app/src/main/cpp -B build/g2p-core-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/g2p-core-host --parallel 2
          ctest --test-dir build/g2p-core-host --output-on-failure
      - name: Prepare AI Megpoid artwork assets
        run: python3 tools/prepare_voicebank_assets.py
      - name: Run editor unit tests and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify and extract Android ARM64 native libraries
        run: |
          set -euo pipefail
          mkdir -p build/android-arm64-libs
          for library in libveavsm.so libveag2p.so libveas5tensor.so; do
            unzip -p app/build/outputs/apk/debug/app-debug.apk "lib/arm64-v8a/$library" > "build/android-arm64-libs/$library"
            readelf -h "build/android-arm64-libs/$library" | grep -E 'Class:|Machine:'
          done
      - name: Upload ARM64 native libraries
        uses: actions/upload-artifact@v4
        with:
          name: VEA-native-libraries-arm64
          path: build/android-arm64-libs/*.so
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VEA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: VEA S5API phone feature context trace

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportS5PhoneFeatureContext.java"
      - ".github/workflows/s5api-phone-feature-context.yml"

permissions:
  contents: read

jobs:
  phone-feature-context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract S5API.dll
        run: python3 tools/inspect_editor_zip.py
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Trace phone-feature context constructors and callsites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/phone-feature-context/ghidra build/ghidra-phone-feature-project
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-phone-feature-project" VEA_S5API_PHONE_FEATURE \
            -import "$PWD/build/editor-package/modules/S5API.dll" \
            -scriptPath "$PWD/tools/ghidra" \
            -postScript ExportS5PhoneFeatureContext.java "$PWD/build/phone-feature-context/ghidra/S5API_PHONE_FEATURE_CONTEXT.md" \
            -analysisTimeoutPerFile 600 -deleteProject
          test -s build/phone-feature-context/ghidra/S5API_PHONE_FEATURE_CONTEXT.md
      - name: Record static-analysis scope
        run: |
          cat > build/phone-feature-context/SCOPE.txt <<'EOF'
          Static Ghidra decompilation and cross-reference analysis only.
          No S5API or VSM native code was executed.
          Values are not promoted to Android render defaults unless their
          dataflow from a concrete Megpoid render-context constructor is proven.
          EOF
      - name: Upload phone-feature context report
        uses: actions/upload-artifact@v4
        with:
          name: VEA-S5API-phone-feature-context
          path: build/phone-feature-context/
          if-no-files-found: error
          retention-days: 30

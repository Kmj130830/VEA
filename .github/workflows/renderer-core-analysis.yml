name: VEA renderer core analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/inspect_editor_zip.py"
      - "tools/ghidra/ExportVsmAnalysis.java"
      - "tools/ghidra/ExportS5ApiAnalysis.java"
      - ".github/workflows/renderer-core-analysis.yml"

permissions:
  contents: read

jobs:
  renderer-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Extract Editor.zip PE modules
        run: python3 tools/inspect_editor_zip.py

      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra
          unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"

      - name: Decompile VSM sequence and audio-buffer boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/renderer-core-analysis/ghidra build/ghidra-renderer-projects
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-renderer-projects" VEA_VSM             -import "$PWD/build/editor-package/modules/VSM.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportVsmAnalysis.java "$PWD/build/renderer-core-analysis/ghidra/VSM_RENDER_BOUNDARY.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/renderer-core-analysis/ghidra/VSM_RENDER_BOUNDARY.md

      - name: Decompile S5API opaque functions and bounded call graph
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-renderer-projects" VEA_S5API             -import "$PWD/build/editor-package/modules/S5API.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportS5ApiAnalysis.java "$PWD/build/renderer-core-analysis/ghidra/S5API_EXPORT_ANALYSIS.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/renderer-core-analysis/ghidra/S5API_EXPORT_ANALYSIS.md

      - name: Preserve exact renderer binaries and PE metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/renderer-core-analysis/modules build/renderer-core-analysis/pe
          cp build/editor-package/modules/VSM.dll build/renderer-core-analysis/modules/
          cp build/editor-package/modules/S5API.dll build/renderer-core-analysis/modules/
          for name in VSM S5API; do
            objdump -p "build/editor-package/modules/${name}.dll" > "build/renderer-core-analysis/pe/${name}.txt"
          done
          cp build/editor-package/INVENTORY.md build/renderer-core-analysis/
          cat > build/renderer-core-analysis/PORT_STATUS.md <<'EOF'
          # Renderer-core port status
          This artifact contains static VSM and S5API analysis plus the exact x64 input modules.
          The Android ELF/ARM64 implementation has not been generated by this workflow.
          Function-pointer signatures, callback ownership, and model tensor contracts must be verified before implementation.
          EOF

      - name: Upload renderer-core analysis
        uses: actions/upload-artifact@v4
        with:
          name: VEA-renderer-core-analysis
          path: build/renderer-core-analysis/
          if-no-files-found: error
          retention-days: 30

name: VEA VDM database internals analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportVdmDatabaseInternals.java"
      - ".github/workflows/s5api-vdm-internals.yml"

  pull_request:
    paths:
      - "Editor.zip"
      - "tools/ghidra/ExportVdmDatabaseInternals.java"
      - ".github/workflows/s5api-vdm-internals.yml"

permissions:
  contents: read
jobs:
  vdm-internals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Extract VDM.dll
        run: |
          python3 tools/inspect_editor_zip.py
          test -s build/editor-package/modules/VDM.dll
      - name: Download and verify Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ghidra_12.2_PUBLIC_20261016.zip
          curl --fail --location --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" -o "$archive"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $archive" | sha256sum --check
          mkdir -p /tmp/ghidra && unzip -q "$archive" -d /tmp/ghidra
          tool="$(find /tmp/ghidra -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$tool"
          echo "GHIDRA_HEADLESS=$tool" >> "$GITHUB_ENV"
      - name: Decompile VDM database manager and resource loaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vdm-internals/ghidra build/ghidra-vdm-internals
          "$GHIDRA_HEADLESS" "$PWD/build/ghidra-vdm-internals" VEA_VDM_INTERNALS             -import "$PWD/build/editor-package/modules/VDM.dll"             -scriptPath "$PWD/tools/ghidra"             -postScript ExportVdmDatabaseInternals.java "$PWD/build/vdm-internals/ghidra/VDM_DATABASE_INTERNALS.md"             -analysisTimeoutPerFile 600 -deleteProject
          test -s build/vdm-internals/ghidra/VDM_DATABASE_INTERNALS.md
      - name: Upload VDM internals
        uses: actions/upload-artifact@v4
        with:
          name: VEA-VDM-database-internals
          path: build/vdm-internals/
          if-no-files-found: error
          retention-days: 30
